<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DebugCopilot</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    window.addEventListener('error', (event) => { window.__dcUIError = String(event.message || event.error || 'error'); });
    window.addEventListener('unhandledrejection', (event) => { window.__dcUIError = String(event.reason || 'unhandled rejection'); });
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">DebugCopilot</div>
    <div id="status" class="status">连接中…</div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>工作区</h2>
      <form id="config-form" class="form">
        <label>前端地址
          <input name="frontendUrl" placeholder="http://localhost:5173" />
        </label>
        <label>后端地址
          <input name="backendUrl" placeholder="http://127.0.0.1:8080" />
        </label>
        <label>日志文件（每行一个）
          <textarea name="logfiles" rows="4" placeholder="logs/app.log"></textarea>
        </label>
        <label>源码根目录
          <input name="sourceRoot" placeholder="../my-project" />
        </label>
        <div class="row">
          <label>时间窗前 (ms)
            <input name="beforeMs" type="number" min="0" step="500" />
          </label>
          <label>时间窗后 (ms)
            <input name="afterMs" type="number" min="0" step="500" />
          </label>
        </div>
        <button type="submit">保存配置</button>
        <p id="config-message" class="message"></p>
      </form>
    </section>

    <section class="panel grow">
      <div class="tabbar">
        <button type="button" class="tab active" data-tab="browser">浏览器</button>
        <button type="button" class="tab" data-tab="requests">请求</button>
        <button type="button" class="tab" data-tab="routing">路由</button>
        <button type="button" class="tab" data-tab="history">历史</button>
        <span class="flex"></span>
        <input id="browser-url" class="url-input" placeholder="http://localhost:5173" />
        <button id="browser-open" type="button" class="secondary">打开</button>
        <button id="browser-reload" type="button" class="secondary">刷新</button>
        <button id="browser-devtools" type="button" class="secondary">DevTools</button>
      </div>

      <div id="tab-browser" class="tab-pane active">
        <div id="browser-slot" class="browser-slot"></div>
      </div>

      <div id="tab-requests" class="tab-pane">
        <div class="split">
          <aside class="split-left">
            <div class="toolbar">
              <label class="inline"><input type="checkbox" id="only-errors" /> 只显示错误</label>
              <button id="clear-requests" type="button" class="secondary">清空</button>
              <span id="capture-hint" class="muted"></span>
            </div>
            <ul id="requests" class="request-list"></ul>
          </aside>
          <section class="split-right">
            <div class="detail-head">
              <span id="request-title">选择一条请求</span>
              <span id="request-meta" class="muted"></span>
            </div>
            <div class="toolbar">
              <input id="diagnose-question" class="url-input" placeholder="描述现象（可选，如：下单报错）" />
              <button id="diagnose-mock" type="button">诊断（Mock）</button>
              <button id="diagnose-live" type="button" class="secondary">真实诊断</button>
              <span id="diagnose-message" class="muted"></span>
            </div>
            <div id="request-detail" class="detail">选择一条请求查看详情</div>
            <div id="diagnose-result" class="diagnose-card" hidden></div>
          </section>
        </div>
      </div>

      <div id="tab-routing" class="tab-pane">
        <div class="toolbar">
          <button id="add-rule" type="button" class="secondary">添加规则</button>
          <button id="save-routing" type="button">保存路由</button>
          <span id="routing-message" class="message"></span>
        </div>
        <div id="routing-list" class="routing-list"></div>
        <p class="muted">按 host + URL 前缀匹配；local 改道到本地，sit 改道到测试环境。OPTIONS 预检不重定向，只补 CORS 头。</p>
      </div>

      <div id="tab-history" class="tab-pane">
        <div class="panel-head">
          <h2>诊断历史</h2>
          <button id="refresh-runs" type="button" class="secondary">刷新</button>
        </div>
        <ul id="runs" class="run-list"></ul>
        <pre id="report" class="report">选择一条历史查看报告</pre>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
